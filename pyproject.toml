[project]
name = "pead-scanner"
version = "0.1.0"
description = "PEAD Scanner — Indian stock market earnings signal system"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Aryan Agarwal" }]
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "supabase>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
