[project]
name = "pead-scanner"
version = "0.1.0"
description = "PEAD Scanner — Indian stock market earnings signal system"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Aryan Agarwal" }]
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "supabase>=2.5",
    # Phase 3 — enrichment layer
    "google-genai>=1.0",      # Gemini PDF parser (new SDK; `google.genai`, not legacy `google.generativeai`)
    "pydantic>=2.0",          # response schema enforcement on LLM output
    "yfinance>=0.2.40",       # OHLCV pulls for Vol_Spike, EAR
    "pandas>=2.0",            # yfinance returns DataFrames; metric vectorization
    "beautifulsoup4>=4.12",   # Screener.in HTML parsing
    "lxml>=5.0",              # bs4 parser backend
    "pypdf>=4.0",             # regex-fallback PDF text extraction
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
