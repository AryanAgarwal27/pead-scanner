name: track-positions

on:
  schedule:
    # BRD §3.6 FR-6.2: daily at 16:00 IST (= 10:30 UTC), after the 15:30 IST
    # cash-session close, so the day's EOD OHLC is available on yfinance.
    - cron: '30 10 * * 1-5'
  workflow_dispatch:

concurrency:
  group: track-positions
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 20      # one yfinance range-fetch per open signal
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Track positions
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:       ${{ secrets.SUPABASE_KEY }}
        run: python jobs/track_positions.py
