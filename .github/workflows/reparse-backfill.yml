name: reparse-backfill

# ─────────────────────────────────────────────────────────────────────────────
# TEMPORARY — Phase 3 backlog catch-up. DELETE THIS FILE once the backlog clears.
#
# The original bulk backfill exhausted the Gemini free-tier RPD and demoted ~1,300
# late-May filings to regex / low / failed. Fix B (column_period + divergence
# guard) lets Gemini recover most NSE filings, but the daily `enrich-eod` cron only
# looks back 14 days, so it can't reach late May. This job re-attempts the
# low-quality parses over a wide (60-day) window, oldest-first, throttled by a
# daily Gemini CALL budget.
#
# Lifecycle:
#   • Runs daily at 03:30 UTC (09:00 IST) — well before enrich-eod (15:00 UTC) — so
#     the two never contend, and the budget is capped at 700 to leave ~300 RPD
#     headroom under the 1,000/day flash-lite free-tier limit for the daily cron.
#   • Re-running is safe (idempotent): per-row invalidate-then-reparse; a budget
#     trip defers the rest to the next run.
#   • BSE filings whose `AttachLive` PDF URLs have expired 404 and stay failed —
#     accepted as permanent data loss; they cost no Gemini budget.
#   • DELETE this workflow when a manual `enrich_eod.py --reparse --window-days 60`
#     run reports 0 remaining low/failed candidates (~2–3 days).
#
# NOTE: this only re-attempts already-parsed-but-low-quality rows. Filings that
# were never parsed (parsed_at IS NULL) are a separate population not handled here.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '30 3 * * *'      # 03:30 UTC = 09:00 IST, daily (incl. weekends)
  workflow_dispatch:
    inputs:
      max_gemini_calls:
        description: 'Daily Gemini CALL budget (counts calls across tiers+retries, not filings)'
        default: '700'
      window_days:
        description: 'Selection window — days back from now'
        default: '60'

concurrency:
  group: reparse-backfill
  cancel-in-progress: false

jobs:
  reparse:
    runs-on: ubuntu-latest
    timeout-minutes: 150       # 700 calls × ~6s throttle + parse ≈ up to ~2h
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Reparse backlog (wide window, budget-capped)
        env:
          SUPABASE_URL:   ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:   ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python jobs/enrich_eod.py --reparse \
            --window-days "${{ github.event.inputs.window_days || '60' }}" \
            --max-gemini-calls "${{ github.event.inputs.max_gemini_calls || '700' }}"
