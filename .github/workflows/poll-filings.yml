name: poll-filings

on:
  schedule:
    # BRD §5.2: every 15 min, 03:00–14:59 UTC, Mon–Fri.
    # 03:00 UTC = 08:30 IST (pre-market opening)
    # 14:45 UTC ≈ 20:15 IST (last fire, covers post-close result-filing peak 3:30–8 PM IST)
    # Indian results are predominantly filed AFTER market close, so the window extends well past 3:30 PM IST.
    - cron: '*/15 3-14 * * 1-5'
  workflow_dispatch:

concurrency:
  group: poll-filings
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Poll
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:       ${{ secrets.SUPABASE_KEY }}
        run: python jobs/poll_filings.py
