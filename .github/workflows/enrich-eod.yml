name: enrich-eod

on:
  schedule:
    # BRD §5.2: 20:30 IST (= 15:00 UTC) Mon-Fri — after the post-close result-filing window.
    - cron: '0 15 * * 1-5'
  workflow_dispatch:

concurrency:
  group: enrich-eod
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30      # serial Gemini parses on a heavy day (~140 filings × ~15s) ≈ 35min worst case
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Enrich
        env:
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python jobs/enrich_eod.py
