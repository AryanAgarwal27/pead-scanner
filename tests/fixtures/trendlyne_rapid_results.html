    "articleBody": "Internet Software \u0026 Services company Pine Labs announced Q4FY26 \u0026 FY26 results\u000D\u000A\u000D\u000AConsolidated Financial Highlights:\u000D\u000A\u000D\u000A\u000D\u000A\u0009Revenue from Operations: The consolidated revenue for FY26 stood at Rs 2,710.59 crore, representing a YoY growth of 19.19% compared to Rs 2,274.27 crore in FY25. For Q4FY26, revenue was Rs 700.51 crore, an increase of 17.02% YoY from Rs 598.64 crore in Q4FY25, and a decrease of 5.88% QoQ from Rs 744.27 crore in Q3FY26.\u000D\u000A\u0009Total Income: For the full year FY26, total income reached Rs 2,847.15 crore, up 22.35% YoY from Rs 2,327.09 crore. Q4FY26 total income was Rs 741.44 crore, growing 21.44% YoY from Rs 610.55 crore and declining 4.91% QoQ from Rs 779.72 crore.\u000D\u000A\u0009Profit After Tax (PAT): The company achieved its first full year of consolidated profitability with a PAT of Rs 112.51 crore in FY26, compared to a loss of Rs 145.49 crore in FY25. Q4FY26 PAT was Rs 59.36 crore, a significant improvement from a loss of Rs 28.91 crore in Q4FY25 and a 40.03% increase QoQ from Rs 42.39 crore in Q3FY26.\u000D\u000A\u0009Profit Before Tax: For FY26, profit before tax was Rs 137.28 crore against a loss of Rs 136.39 crore in FY25. Q4FY26 profit before tax was Rs 68.41 crore, compared to a loss of Rs 22.21 crore in Q4FY25 and an increase of 9.37% QoQ from Rs 62.55 crore in Q3FY26.\u000D\u000A\u000D\u000A\u000D\u000AStandalone Financial Highlights:\u000D\u000A\u000D\u000A\u000D\u000A\u0009Revenue from Operations: Standalone revenue for FY26 was Rs 1,926.09 crore, up 20.58% YoY from Rs 1,597.31 crore. In Q4FY26, revenue stood at Rs 515.42 crore, increasing 24.01% YoY from Rs 415.62 crore and decreasing 6.01% QoQ from Rs 548.40 crore.\u000D\u000A\u0009Total Income: Standalone total income for FY26 was Rs 2,098.38 crore, a 20.55% increase YoY from Rs 1,740.58 crore. For Q4FY26, it was Rs 572.23 crore, up 19.83% YoY from Rs 477.53 crore and down 4.44% QoQ from Rs 598.82 crore.\u000D\u000A\u0009Profit After Tax (PAT): Standalone PAT for FY26 grew by 434.90% YoY to Rs 149.88 crore from Rs 28.02 crore. Q4FY26 PAT was Rs 67.29 crore, up 78.44% YoY from Rs 37.71 crore and up 18.82% QoQ from Rs 56.63 crore.\u000D\u000A\u0009Profit Before Tax: Standalone profit before tax for FY26 was Rs 178.77 crore, up 394.93% YoY from Rs 36.12 crore. Q4FY26 profit before tax was Rs 89.84 crore, up 102.75% YoY from Rs 44.31 crore and up 19.85% QoQ from Rs 74.96 crore.\u000D\u000A\u000D\u000A\u000D\u000ABusiness Highlights:\u000D\u000A\u000D\u000A\u000D\u000A\u0009Pine Labs recorded its first full year of profitability with a consolidated PAT of Rs 113 crore for FY26.\u000D\u000A\u0009Operating cash flows reached Rs 395 crore for FY26, growing 8x year\u002Don\u002Dyear. Q4FY26 delivered Rs 676 crore in operating cash flow, the highest quarterly figure in the company’s history.\u000D\u000A\u0009Adjusted EBITDA for FY26 reached Rs 559 crore, growing 57% YoY, with margins expanding from 16% to 21% within the year.\u000D\u000A\u0009The company processed USD 194 billion in Gross Transaction Value (GTV) in FY26, growing 50% YoY.\u000D\u000A\u0009UPI volumes accelerated 68% and the platform is now enabling over 20 million daily transactions.\u000D\u000A\u0009International revenue crossed Rs 400 crore in FY26, growing at a 44% CAGR over the past three years, and now contributes approximately 15% of total revenue.\u000D\u000A\u0009Approximately 89% of the company’s code changes are currently contributed by AI agents.\u000D\u000A\u0009The company has expanded its footprint to 22 countries, including entry into the US market through the launch of prepaid programs.\u000D\u000A\u0009Segment\u002Dwise Performance:\u000D\u000A\u0009\u000D\u000A\u0009\u0009Digital infrastructure and transaction platform: This segment recorded a revenue of Rs 1,836.82 crore for FY26 and Rs 466.12 crore for Q4FY26.\u000D\u000A\u0009\u0009Issuing and acquiring platform: This segment recorded a revenue of Rs 873.77 crore for FY26 and Rs 234.39 crore for Q4FY26.\u000D\u000A\u0009\u000D\u000A\u0009\u000D\u000A\u000D\u000A\u000D\u000AAmrish Rau, Chief Executive Officer, Pine Labs. said: “These numbers tell us we are winning transactions, winning merchants, and winning in new markets,”\u000D\u000A\u000D\u000A\u0022When GTV grows at 50% while revenue grows at 19%, it reflects the platform depth we have built —and it leaves significant monetisation headroom ahead of us.”\u000D\u000A\u000D\u000A\u0022We are not just processing payments,” said Rau. \u0022We are building the infrastructure layer that merchants, financial institutions, and brands will rely on to grow —in India and across the Global South. The fintech model Pine Labs has built at scale in Indiais exactly what emerging markets across Southeast Asia, the Middle East, and Africa are looking to adopt. Thatis a structural opportunity, and we intend to win it.\u0022\u000D\u000A\u000D\u000AResult PDF",

    "articleBody": "Auto Parts \u0026 Equipment company Suprajit Engineering announced Q4FY26 \u0026 FY26 results\u000D\u000A\u000D\u000AStandalone Financial Highlights:\u000D\u000A\u000D\u000A\u000D\u000A\u0009Total Income:\u000D\u000A\u000D\u000A\u0009\u000D\u000A\u0009\u0009Reported Rs 4,988.72 million for Q4FY26, compared to Rs 5,226.29 million in Q3FY26, reflecting a QoQ decrease of 4.55%. Compared to Rs 4,546.18 million in Q4FY25, this is a YoY increase of 9.74%.\u000D\u000A\u0009\u0009For FY26, the total income was Rs 19,680.22 million, compared to Rs 18,185.59 million in FY25, a YoY increase of 8.22%.\u000D\u000A\u0009\u000D\u000A\u0009\u000D\u000A\u0009Profit for the period:\u000D\u000A\u0009\u000D\u000A\u0009\u0009Reported Rs 659.93 million for Q4FY26, compared to Rs 710.26 million in Q3FY26, reflecting a QoQ decrease of 7.09%. Compared to Rs 544.56 million in Q4FY25, this is a YoY increase of 21.19%.\u000D\u000A\u0009\u0009For FY26, the profit was Rs 2,747.43 million, compared to Rs 2,527.28 million in FY25, a YoY increase of 8.71%.\u000D\u000A\u0009\u000D\u000A\u0009\u000D\u000A\u000D\u000A\u000D\u000AConsolidated Financial Highlights:\u000D\u000A\u000D\u000A\u000D\u000A\u0009Total Income:\u000D\u000A\u000D\u000A\u0009\u000D\u000A\u0009\u0009Reported Rs 10,732.47 million for Q4FY26, compared to Rs 9,897.74 million in Q3FY26, reflecting a QoQ increase of 8.43%. Compared to Rs 8,868.11 million in Q4FY25, this is a YoY increase of 21.02%.\u000D\u000A\u0009\u0009For FY26, the total income was Rs 39,406.26 million, compared to Rs 33,231.35 million in FY25, a YoY increase of 18.58%.\u000D\u000A\u0009\u000D\u000A\u0009\u000D\u000A\u0009Profit for the period:\u000D\u000A\u0009\u000D\u000A\u0009\u0009Reported Rs 711.13 million for Q4FY26, compared to Rs 125.27 million in Q3FY26, reflecting a QoQ increase of 467.68%. Compared to Rs 272.37 million in Q4FY25, this is a YoY increase of 161.09%.\u000D\u000A\u0009\u0009For FY26, the profit was Rs 1,826.73 million, compared to Rs 992.65 million in FY25, a YoY increase of 84.02%.\u000D\u000A\u0009\u000D\u000A\u0009\u000D\u000A\u000D\u000A\u000D\u000ABusiness Highlights:\u000D\u000A\u000D\u000A\u000D\u000A\u0009Segment Performance: The Company is engaged in the business of manufacturing and selling automotive and other components, which is monitored as a single segment under Ind AS 108.\u000D\u000A\u0009Business Acquisitions and Liquidations:\u000D\u000A\u0009\u000D\u000A\u0009\u0009The Group completed the acquisition of the business of Stahlshmidt Cable Systems (SCS) through insolvency proceedings in Germany. The first stage was completed in the previous year effective July 1, 2024, and the second stage in Canada and China was completed effective May 31, 2025.\u000D\u000A\u0009\u0009SCS Polska Sp. z o.o. (subsidiary in Poland) and Trifa Lamps Germany GmbH (subsidiary in Germany) were liquidated effective August 2025 and March 2026, respectively.\u000D\u000A\u0009\u000D\u000A\u0009\u000D\u000A\u000D\u000A\u000D\u000AResult PDF",

    "articleBody": "Fertilizers company Southern Petrochemicals Industries Corporation announced Q4FY26 \u0026 FY26 results\u000D\u000A\u000D\u000AConsolidated Financial Highlights:\u000D\u000A\u000D\u000A\u000D\u000A\u0009Revenue from Operations: Consolidated revenue for Q4FY26 was Rs 584.15 crore, a decrease of 22.56% YoY from Rs 754.37 crore and a 24.52% QoQ decline from Rs 773.89 crore. For the full year FY26, revenue was Rs 2,955.97 crore.\u000D\u000A\u0009Total Income: Consolidated total income for Q4FY26 stood at Rs 595.73 crore, compared to Rs 759.44 crore in Q4FY25 and Rs 778.39 crore in Q3FY26. For the full year FY26, total consolidated income reached Rs 3,015.10 crore.\u000D\u000A\u0009Net Profit: The consolidated net profit for Q4FY26 was Rs 29.49 crore, marking a YoY growth of 51.46% from Rs 19.47 crore, but a QoQ decrease of 45.46% from Rs 54.07 crore. For the full year FY26, consolidated net profit stood at Rs 211.48 crore, an increase of 35.89% from Rs 155.62 crore in FY25.\u000D\u000A\u0009Earnings Per Share (EPS): Consolidated basic and diluted EPS for Q4FY26 was Rs 1.45, while for the full year FY26, it reached Rs 10.39 compared to Rs 7.64 in FY25.\u000D\u000A\u000D\u000A\u000D\u000AStandalone Financial Highlights:\u000D\u000A\u000D\u000A\u000D\u000A\u0009Revenue from Operations: For Q4FY26, the company reported revenue of Rs 584.15 crore, which is a decrease of 22.56% YoY compared to Rs 754.37 crore in Q4FY25 and a decline of 24.52% QoQ from Rs 773.89 crore in Q3FY26. For the full year FY26, revenue stood at Rs 2,955.97 crore versus Rs 3,086.33 crore in FY25, a decrease of 4.22%.\u000D\u000A\u0009Total Income: Total income for Q4FY26 reached Rs 595.73 crore, down 21.56% YoY from Rs 759.44 crore and down 23.47% QoQ from Rs 778.39 crore. For the entire FY26, total income was Rs 3,015.10 crore compared to Rs 3,100.25 crore in FY25.\u000D\u000A\u0009Net Profit: The standalone net profit for Q4FY26 was Rs 26.15 crore, representing a significant YoY growth of 99.77% from Rs 13.09 crore, though it saw a QoQ decline of 46.24% from Rs 48.64 crore in Q3FY26. For the full year FY26, net profit grew by 42.28% to Rs 186.16 crore from Rs 130.84 crore in FY25.\u000D\u000A\u0009Earnings Per Share (EPS): Basic and diluted EPS for Q4FY26 stood at Rs 1.28 compared to Rs 0.64 in Q4FY25. For the full year FY26, EPS increased to Rs 9.14 from Rs 6.43 in FY25.\u000D\u000A\u000D\u000A\u000D\u000ABusiness Highlights:\u000D\u000A\u000D\u000A\u000D\u000A\u0009Dividend: The Board of Directors has recommended a dividend of 20% on equity shares, which amounts to Rs 2/\u002D per share for the financial year 2025\u002D26, subject to shareholder approval.\u000D\u000A\u0009Segment Performance: The company\u0027s business operations are reviewed as a single segment, which is the manufacture and sale of fertilizers. It majorly operates in India and has no non\u002Dcurrent operating assets located outside the country.\u000D\u000A\u0009Operational Metrics: Urea production for FY26 reached 7.21 lac MT, with sales totaling 7.14 lac MT. During Q4FY26, the Urea plant was in operation for 73 days.\u000D\u000A\u0009Subsidy Income: Total subsidy for FY26 reached Rs 2,426.91 crore, accounted for based on the provisional Retention Price (RP) as the final retention price has not yet been announced by the Department of Fertilizers.\u000D\u000A\u0009Insurance and Claims:\u000D\u000A\u0009\u000D\u000A\u0009\u0009The company received Rs 6.98 crore in Q4FY26 as an insurance claim for the replacement of machinery spares damaged during the December 2023 floods.\u000D\u000A\u0009\u0009Total insurance claims received for flood damages reached Rs 55.18 crore, with a further claim of Rs 19.60 crore currently under process.\u000D\u000A\u0009\u0009The Tuticorin plant was shut down from March 03, 2026, to March 19, 2026, for repairs. An insurance claim for Rs 4.25 crore for repairs and Rs 21.95 crore for shutdown/start\u002Dup costs is under process.\u000D\u000A\u0009\u000D\u000A\u0009\u000D\u000A\u0009Leadership Change: Mr. Narasimhan Raghunathan was appointed as the Chief Financial Officer (CFO) of the company, effective May 23, 2026, succeeding Mr. KR Anandan, who will continue as a Whole\u002DTime Director.\u000D\u000A\u0009Audit Opinion: Statutory Auditors have issued an unmodified opinion on both Standalone and Consolidated financial results for the year ended March 31, 2026.\u000D\u000A\u000D\u000A\u000D\u000AResult PDF",
